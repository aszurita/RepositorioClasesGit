<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro equipo | Práctica de Git</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px;
      font-family: Arial, sans-serif;
      color: #1e293b;
      background: #f1f5f9;
    }
    main { max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 8px; }
    header p { color: #475569; margin-bottom: 28px; }
    .equipo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    iframe {
      width: 100%;
      height: 220px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: white;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Nuestro equipo</h1>
      <p>Alejandro</p>
    </header>

    <section class="equipo" aria-label="Participantes">

      <!-- Después de integrar otro archivo en main, añade su tarjeta aquí:
      <iframe src="participantes/tu-nombre.html" title="Tarjeta de tu nombre"></iframe>
      -->
    </section>
  </main>
</body>
</html>
